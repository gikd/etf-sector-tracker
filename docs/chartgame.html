<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차트게임 · 메가캡 300</title>
<script>document.documentElement.className=(function(){try{return localStorage.getItem("etf-theme")||"theme-dark"}catch(e){return "theme-dark"}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Staatliches&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=260901">
<style>
  .cg-notice { font-family:var(--sans); font-size:12.5px; line-height:1.7; color:var(--muted); border:1px solid var(--line);
    border-left:2px solid var(--clay); border-radius:6px; padding:10px 14px; margin:0 0 18px; max-width:880px; }
  .cg-notice b { color:var(--ink); font-weight:700; }
  .board { background:var(--card); border:1px solid var(--line); border-radius:var(--obj-radius); padding:14px 14px 10px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .top .q { font-size:18px; font-weight:800; letter-spacing:-.01em; }
  .top .q .hint { font-size:12.5px; font-weight:600; color:var(--muted); margin-left:6px; }
  .top .day { font-family:var(--mono); font-size:13px; color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin:10px 0 4px; }
  .stats .box { border:1px solid var(--line); border-radius:var(--card-radius); padding:8px 10px; }
  .stats .lbl { font-size:10.5px; color:var(--muted); }
  .stats .val { font-family:var(--mono); font-size:16px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
  .ctrl { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .ctrl button { border:none; border-radius:6px; padding:10px 18px; font-weight:800; font-size:14px; cursor:pointer; font-family:var(--sans); }
  .ctrl .buy { background:var(--up); color:#fff; }
  .ctrl .sell { background:var(--down); color:#fff; }
  .ctrl .next { background:var(--ink); color:var(--paper); }
  .ctrl .ghost { background:transparent; color:var(--muted); border:1.5px solid var(--line-strong); }
  .ctrl button:disabled { opacity:.3; cursor:not-allowed; }
  .log { font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:10px; line-height:1.7; }
  .result { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  .result h3 { font-size:17px; font-weight:800; margin-bottom:6px; }
  .result .verdict { font-family:var(--serif); font-size:15px; line-height:1.8; }
  .result table { border-collapse:collapse; margin-top:8px; font-size:13px; }
  .result td { padding:4px 14px 4px 0; font-family:var(--mono); }
  .result td:first-child { font-family:var(--sans); color:var(--muted); }
  .rec { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:16px; }
  .rec b { color:var(--ink); font-family:var(--mono); }
  .opts { display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted); margin-top:10px; }
  .opts label { display:flex; gap:5px; align-items:center; cursor:pointer; }
  @media (max-width:640px) { .stats { grid-template-columns:repeat(2, minmax(0,1fr)); } .ctrl button { flex:1; padding:10px 8px; } }
</style>
</head>
<body>
<div class="nav">
  <a href="index.html">글로벌 메가캡</a>
  <a href="news.html">뉴스플로우</a>
  <a href="mock.html">모의투자</a>
  <a href="chartgame.html" class="cur">차트게임</a>
</div>
<div class="kicker">차트게임 · 시총 TOP300의 실제 차트</div>
<header>
  <h1>차트게임</h1>
  <span class="updated" id="updated"></span>
</header>

<div class="cg-notice">
  TOP300 종목 하나의 <b>실제 과거 차트</b>가 이름을 가린 채 나옵니다. 앞의 70일을 보고 사거나 팔거나 지켜본 뒤, 하루씩 넘기며 <b>20거래일</b>을 버팁니다.
  끝나면 종목과 기간이 공개되고, 그냥 들고만 있었을 때와 비교합니다. 가격은 첫날 종가를 100으로 맞춰 보여 줍니다. 재미와 연습용이며 투자 권유가 아닙니다.
</div>

<div class="board">
  <div class="top"><div class="q" id="q"></div><div class="day" id="day"></div></div>
  <div id="chart"></div>
  <div class="stats" id="stats"></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="opts"><label><input type="checkbox" id="showSec"> 섹터 힌트 보기</label></div>
  <div class="log" id="log"></div>
  <div class="result" id="result" hidden></div>
</div>
<div class="rec" id="rec"></div>

<footer>차트: 트래커 데이터(Yahoo Finance 일봉, 최근 약 130거래일) · 기록은 이 브라우저에만 저장됩니다.</footer>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<script src="theme.js?v=260901"></script>
<script src="stocks-common.js?v=260901"></script>
<script>
const SHOW = 70, PLAY = 20, KEY = "chartgame-v1";
let DATA = null, G = null;
const byTicker = () => null; function renderModal() {}
let REC = { rounds: 0, beat: 0, sum: 0, best: null };
try { const r = JSON.parse(localStorage.getItem(KEY) || "null"); if (r && typeof r.rounds === "number") REC = r; } catch (e) {}
try { document.getElementById("showSec").checked = localStorage.getItem("chartgame-sec") === "1"; } catch (e) {}
const pct = v => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function newRound() {
  const pool = DATA.stocks.filter(s => s.candles && s.candles.c.length >= SHOW + PLAY);
  const s = pool[Math.floor(Math.random() * pool.length)];
  const n = s.candles.c.length, start = Math.floor(Math.random() * (n - SHOW - PLAY + 1));
  const base = s.candles.c[start];
  const k = x => Math.round(x / base * 10000) / 100;     // 첫날 종가 = 100
  const sl = a => a.slice(start, start + SHOW + PLAY);
  G = { s, start, i: SHOW - 1, end: SHOW + PLAY - 1, hold: false, cash: 100, sh: 0, entry: null, trades: [], done: false,
    c: { o: sl(s.candles.o).map(k), h: sl(s.candles.h).map(k), l: sl(s.candles.l).map(k), c: sl(s.candles.c).map(k), v: sl(s.candles.v) },
    dates: sl(s.dates) };
  document.getElementById("result").hidden = true;
  render();
}
const px = () => G.c.c[G.i];
const value = () => G.cash + G.sh * px();
function act(side) {
  if (G.done) return;
  if (side === "buy" && !G.hold) { G.sh = G.cash / px(); G.cash = 0; G.hold = true; G.trades.push(`D${G.i - SHOW + 1} 매수 ${px().toFixed(2)}`); }
  if (side === "sell" && G.hold) { G.cash = G.sh * px(); G.sh = 0; G.hold = false; G.trades.push(`D${G.i - SHOW + 1} 매도 ${px().toFixed(2)}`); }
  render();
}
function next(all) {
  if (G.done) return;
  do { G.i++; } while (all && G.i < G.end);
  if (G.i >= G.end) finish(); else render();
}
function finish() {
  G.done = true;
  const mine = (value() / 100 - 1) * 100;
  const bh = (G.c.c[G.end] / G.c.c[SHOW - 1] - 1) * 100;     // 게임 시작일에 사서 끝까지
  const beat = mine > bh + 1e-9;
  REC.rounds++; if (beat) REC.beat++; REC.sum += mine - bh;
  if (REC.best == null || mine > REC.best) REC.best = mine;
  try { localStorage.setItem(KEY, JSON.stringify(REC)); } catch (e) {}
  const s = G.s, d0 = G.dates[SHOW - 1], d1 = G.dates[G.end];
  const real0 = s.candles.c[G.start + SHOW - 1], real1 = s.candles.c[G.start + G.end];
  const r = document.getElementById("result");
  r.hidden = false;
  r.innerHTML = `<h3>${esc(s.name)} <span style="color:var(--muted);font-size:13px;font-family:var(--mono)">${s.ticker} · ${esc(s.sector)}</span></h3>
    <div class="verdict">${beat ? "그냥 들고 있었을 때보다 잘했습니다." : Math.abs(mine - bh) < 1e-9 ? "그냥 들고 있었을 때와 같습니다." : "이번에는 그냥 들고 있는 편이 나았습니다."}
      게임 구간은 ${d0}부터 ${d1}까지였고, 실제 주가는 ${fmtPx(real0, s.ccy)}에서 ${fmtPx(real1, s.ccy)}로 움직였습니다.</div>
    <table><tr><td>내 결과</td><td class="${cls(mine)}">${pct(mine)}</td></tr>
      <tr><td>그냥 들고 있었다면</td><td class="${cls(bh)}">${pct(bh)}</td></tr>
      <tr><td>거래</td><td>${G.trades.length ? G.trades.length + "회" : "없음(관망)"}</td></tr></table>
    <div class="ctrl"><button class="next" onclick="newRound()">다음 차트 ▶</button></div>`;
  render();
}

function render() {
  const sec = document.getElementById("showSec").checked;
  document.getElementById("q").innerHTML = G.done ? esc(G.s.name) : `이 종목은 무엇일까요?${sec ? `<span class="hint">섹터: ${esc(G.s.sector)}</span>` : ""}`;
  const day = G.i - SHOW + 1;
  document.getElementById("day").textContent = G.done ? `${PLAY}거래일 끝` : day === 0 ? `시작 전 · 남은 ${PLAY}거래일` : `D${day} · 남은 ${PLAY - day}거래일`;
  // 차트: 보이는 구간만, 날짜는 가리고 D-숫자로
  const n = G.i + 1;
  const lbl = G.dates.slice(0, n).map((_, j) => { const x = j - (SHOW - 1); return "0000-" + (x === 0 ? "시작" : "D" + x); });
  const fake = { candles: { o: G.c.o.slice(0, n), h: G.c.h.slice(0, n), l: G.c.l.slice(0, n), c: G.c.c.slice(0, n), v: G.c.v.slice(0, n) },
    dates: G.done ? G.dates.slice(0, n) : lbl };
  document.getElementById("chart").innerHTML = candleSVG(fake, n);
  const mine = (value() / 100 - 1) * 100;
  document.getElementById("stats").innerHTML = `
    <div class="box"><div class="lbl">현재가(첫날=100)</div><div class="val">${px().toFixed(2)}</div></div>
    <div class="box"><div class="lbl">포지션</div><div class="val ${G.hold ? "pos" : ""}">${G.hold ? "보유 중" : "현금"}</div></div>
    <div class="box"><div class="lbl">내 결과</div><div class="val ${cls(mine)}">${pct(mine)}</div></div>
    <div class="box"><div class="lbl">거래</div><div class="val">${G.trades.length}회</div></div>`;
  document.getElementById("ctrl").innerHTML = G.done ? "" : `
    <button class="buy" ${G.hold ? "disabled" : ""} onclick="act('buy')">매수</button>
    <button class="sell" ${G.hold ? "" : "disabled"} onclick="act('sell')">매도</button>
    <button class="next" onclick="next(false)">다음 날 ▶</button>
    <button class="ghost" onclick="next(true)">끝까지</button>`;
  document.getElementById("log").textContent = G.trades.join(" · ");
  const avg = REC.rounds ? REC.sum / REC.rounds : 0;
  document.getElementById("rec").innerHTML = `<span>판 <b>${REC.rounds}</b></span><span>들고만 있기보다 잘한 판 <b>${REC.beat}</b>${REC.rounds ? ` (${Math.round(REC.beat / REC.rounds * 100)}%)` : ""}</span>
    <span>평균 차이 <b class="${cls(avg)}">${REC.rounds ? pct(avg) : "–"}</b></span><span>최고 <b>${REC.best == null ? "–" : pct(REC.best)}</b></span>
    <a href="#" onclick="if(confirm('기록을 지울까요?')){REC={rounds:0,beat:0,sum:0,best:null};try{localStorage.removeItem(KEY)}catch(e){};render()}return false" style="color:var(--muted)">기록 지우기</a>`;
}
document.getElementById("showSec").addEventListener("change", e => { try { localStorage.setItem("chartgame-sec", e.target.checked ? "1" : "0"); } catch (x) {} render(); });
document.addEventListener("keydown", e => {
  if (!G || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); G.done ? newRound() : next(false); }
  if (e.key === "b" || e.key === "B") act("buy");
  if (e.key === "s" || e.key === "S") act("sell");
});
fetch("megacap.json?t=" + Date.now()).then(r => r.json()).then(d => {
  DATA = d; document.getElementById("updated").textContent = `TOP300 ${d.count}종목 · 시세 ${d.updated}`; newRound();
}).catch(() => { document.getElementById("chart").innerHTML = `<p style="color:var(--down)">데이터를 불러올 수 없습니다.</p>`; });
</script>
</body>
</html>
